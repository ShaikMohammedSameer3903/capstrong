##############################################################
# Render Deployment Blueprint
# Deploys CloudOps Backend API on Render Web Service
##############################################################

services:
  - type: web
    name: cloudops-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon

    buildCommand: npm install
    startCommand: node --max-old-space-size=400 index.js

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # Security & JWT Secrets
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true

      # CORS & Frontend Origin (e.g. https://your-app.vercel.app)
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      # Microsoft Entra ID (Azure)
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_SUBSCRIPTION_ID
        sync: false

      # Amazon Web Services (AWS)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCOUNT_ID
        sync: false

      # Google Cloud Platform & OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Optional PostgreSQL (runs SQLite if left unset)
      - key: DATABASE_URL
        sync: false
