# ==============================================================================
# Kubernetes Production Orchestration Specification
# CLOUD-223 Multi-Tier Architecture with Dedicated Port Isolation
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: cloud223-platform

---

# ──────────────────────────────────────────────────────────────────────────────
# Configuration & Secret Management
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud223-config
  namespace: cloud223-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_PORT: "5432"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://cloud223-redis-service:6379"
  DATABASE_URL: "postgres://cloudops:cloudops_secure_pass@cloud223-postgres-service:5432/cloudops"

---

apiVersion: v1
kind: Secret
metadata:
  name: cloud223-secrets
  namespace: cloud223-platform
type: Opaque
stringData:
  POSTGRES_USER: "cloudops"
  POSTGRES_PASSWORD: "cloudops_secure_pass"
  POSTGRES_DB: "cloudops"
  JWT_SECRET: "cloudops_super_secret_jwt_key_production_32chars"
  SESSION_SECRET: "cloudops_super_secret_session_key_production_32chars"
  REFRESH_SECRET: "cloudops_super_secret_refresh_key_production_32chars"

---

# ──────────────────────────────────────────────────────────────────────────────
# Tier 1: Persistent Database (PostgreSQL - Port 5432)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloud223-postgres-pvc
  namespace: cloud223-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud223-postgres
  namespace: cloud223-platform
  labels:
    app: cloud223-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud223-postgres
  template:
    metadata:
      labels:
        app: cloud223-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres-port
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cloud223-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud223-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cloud223-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: cloud223-postgres-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: cloud223-postgres-service
  namespace: cloud223-platform
spec:
  selector:
    app: cloud223-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: postgres-tcp
  type: ClusterIP

---

# ──────────────────────────────────────────────────────────────────────────────
# Tier 2: In-Memory Caching & Queue (Redis - Port 6379)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud223-redis
  namespace: cloud223-platform
  labels:
    app: cloud223-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud223-redis
  template:
    metadata:
      labels:
        app: cloud223-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis-port
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: cloud223-redis-service
  namespace: cloud223-platform
spec:
  selector:
    app: cloud223-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
      name: redis-tcp
  type: ClusterIP

---

# ──────────────────────────────────────────────────────────────────────────────
# Tier 3: Backend API Server (Node.js Express - Port 5000)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud223-backend
  namespace: cloud223-platform
  labels:
    app: cloud223-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud223-backend
  template:
    metadata:
      labels:
        app: cloud223-backend
    spec:
      containers:
        - name: backend
          image: cloud223-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http-api
          envFrom:
            - configMapRef:
                name: cloud223-config
            - secretRef:
                name: cloud223-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: cloud223-backend-service
  namespace: cloud223-platform
spec:
  selector:
    app: cloud223-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      name: http-api
  type: ClusterIP

---

# ──────────────────────────────────────────────────────────────────────────────
# Tier 4: Frontend Web Tier (React SPA + Nginx - Port 80)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud223-frontend
  namespace: cloud223-platform
  labels:
    app: cloud223-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud223-frontend
  template:
    metadata:
      labels:
        app: cloud223-frontend
    spec:
      containers:
        - name: frontend
          image: cloud223-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http-web
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: cloud223-frontend-service
  namespace: cloud223-platform
spec:
  selector:
    app: cloud223-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
      name: http-web
  type: LoadBalancer
