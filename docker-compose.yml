services:
  # ─────────────────────────────────────────────────────────────
  # 1. MongoDB Database Tier (Port 27017)
  # ─────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: cloudops-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-capstrong}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudops-net

  # ─────────────────────────────────────────────────────────────
  # 2. Backend API – Node.js Express + SQLite + MongoDB (Port 3001)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cloudops-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3002}:3001"
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: production
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      # SQLite path inside the container - persisted via volume below
      DATABASE_PATH: /app/server/data/cloudops.db
      # MongoDB Atlas or local container fallback
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/capstrong}
      MONGODB_DB: ${MONGODB_DB:-capstrong}
      # Set this to the public URL of your frontend container / CDN
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:5174,http://127.0.0.1:8080,http://127.0.0.1:5173}
      # NOTE: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
      #       GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, JWT_SECRET, SESSION_SECRET, REFRESH_SECRET
      #       are loaded from env_file (.env) above. Do NOT duplicate them here with :-empty defaults
      #       as that would override the env_file values with empty strings.
    volumes:
      # Persist SQLite database across container restarts
      - sqlite_data:/app/server/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - cloudops-net

  # ─────────────────────────────────────────────────────────────
  # 3. Frontend – React + NGINX SPA (Port 80 → Host 8080)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cloudops-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudops-net

volumes:
  sqlite_data:
    driver: local
  mongo_data:
    driver: local

networks:
  cloudops-net:
    driver: bridge
